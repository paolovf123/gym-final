<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Final">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Gym Final — Arma tu rutina</title>
<style>
  :root {
    --bg: #101114; --card: #17181D; --ink: #F2F1EC; --muted: #8E8F98;
    --line: #26272E; --accent: #FF4A24; --accent-ink: #140905;
    --soft: #1D1E24; --warn-bg: #2E2817; --warn-ink: #E8C979;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  html { color-scheme: dark; }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
  ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
  body {
    background: var(--bg); color: var(--ink); margin: 0; padding: 0 1rem 7rem;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
    --display: "Haettenschweiler", "Impact", "Arial Narrow", "sans-serif-condensed", "Segoe UI", sans-serif;
  }
  .wrap { max-width: 700px; margin: 0 auto; }

  /* ---------- Hero ---------- */
  .hero { padding: 2rem 0 1rem; }
  .hero .kicker {
    font-family: var(--display); text-transform: uppercase; letter-spacing: .22em;
    font-size: .85rem; color: var(--accent); margin: 0 0 .2rem;
    animation: riseIn .6s .05s backwards;
  }
  .hero h1 {
    font-family: var(--display); text-transform: uppercase; font-style: italic;
    font-size: clamp(3rem, 13vw, 5.2rem); line-height: .92; margin: 0;
    letter-spacing: .05em; animation: riseIn .6s .12s backwards;
  }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .stripes {
    height: 10px; margin: .9rem 0 .7rem; border-radius: 2px;
    background: repeating-linear-gradient(-55deg, var(--accent) 0 14px, transparent 14px 26px);
    animation: growX .7s .25s backwards; transform-origin: left;
  }
  .ticker {
    display: flex; flex-wrap: wrap; gap: .35rem 1rem;
    font-family: var(--display); text-transform: uppercase; letter-spacing: .12em;
    font-size: .95rem; color: var(--muted); animation: riseIn .6s .3s backwards;
  }
  .ticker b { color: var(--ink); font-weight: 400; }

  /* ---------- Barra superior: menú + tabs ---------- */
  .tabs-wrap {
    position: sticky; top: 0; z-index: 40; margin: 0 -1rem; padding: .6rem 1rem;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .topbar { display: flex; gap: .5rem; align-items: center; max-width: 700px; margin: 0 auto; }
  .menu-btn {
    flex: none; width: 44px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 1.15rem; cursor: pointer;
    transition: transform .15s, border-color .2s;
  }
  .menu-btn:active { transform: scale(.92); border-color: var(--accent); }
  .tabs { flex: 1; display: flex; gap: .45rem; overflow-x: auto; scrollbar-width: none; padding: .15rem; align-items: center; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: .45rem 1rem .4rem; cursor: pointer;
    font-family: var(--display); text-transform: uppercase; letter-spacing: .09em; font-size: .95rem;
    display: flex; align-items: center; gap: .45rem;
    transition: transform .15s, background .2s, border-color .2s;
  }
  .tab:active { transform: scale(.94); }
  .tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc, var(--accent)); }
  .tab[aria-pressed="true"] { background: var(--tc, var(--accent)); border-color: var(--tc, var(--accent)); color: #101014; }
  .tab[aria-pressed="true"] .dot { background: #101014; }
  .sec-label {
    font-family: var(--display); text-transform: uppercase; font-style: italic;
    letter-spacing: .1em; font-size: 1.25rem; padding: .2rem .3rem; color: var(--ink);
  }

  /* ---------- Menú lateral (drawer) ---------- */
  .edge-zone { position: fixed; left: 0; top: 0; bottom: 0; width: 18px; z-index: 129; }
  .edge-hint {
    position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 128;
    width: 6px; height: 130px; border-radius: 0 6px 6px 0;
    background: color-mix(in srgb, var(--accent) 55%, transparent);
    pointer-events: none; transition: opacity .25s; animation: edgePulse 2.4s ease-in-out infinite;
  }
  .edge-hint.oculto { opacity: 0; animation: none; }
  @keyframes edgePulse { 50% { background: color-mix(in srgb, var(--accent) 90%, transparent); } }
  @media (hover: none) { .edge-hint, .edge-zone { display: none; } }
  .drawer-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 130;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .drawer-bg.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(78vw, 300px);
    background: var(--card); border-right: 1px solid var(--line); z-index: 131;
    transform: translateX(-105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    padding: 1.3rem 1rem 1.1rem; display: flex; flex-direction: column; gap: .45rem;
    box-shadow: var(--shadow);
  }
  .drawer.open { transform: none; }
  .drawer .dh {
    font-family: var(--display); font-style: italic; text-transform: uppercase;
    font-size: 1.9rem; margin: 0 0 1rem; letter-spacing: .06em; line-height: 1;
  }
  .drawer .dh em { color: var(--accent); font-style: italic; }
  .drawer button {
    display: flex; align-items: center; gap: .75rem; text-align: left;
    border: 1px solid transparent; background: transparent; color: var(--ink);
    border-radius: 14px; padding: .7rem .75rem; font-size: 1rem; font-weight: 650;
    cursor: pointer; font-family: inherit; transition: background .2s, border-color .2s, color .2s;
  }
  .drawer button .ic {
    flex: none; width: 38px; height: 38px; border-radius: 11px; background: var(--soft);
    display: grid; place-items: center; font-size: 1.05rem;
  }
  .drawer button[aria-pressed="true"] { background: var(--soft); border-color: var(--line); color: var(--accent); }
  .drawer button small { display: block; font-weight: 400; font-size: .72rem; color: var(--muted); }
  .drawer .dnote { margin-top: auto; font-size: .7rem; color: var(--muted); }

  /* ---------- Cards ---------- */
  main { display: flex; flex-direction: column; gap: 1.1rem; padding-top: 1rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 1.2rem 1.2rem 1.3rem; position: relative; overflow: hidden;
    box-shadow: var(--shadow); animation: riseIn .55s backwards;
  }
  .wm {
    position: absolute; right: -.5rem; top: -2.2rem; font-family: var(--display);
    font-style: italic; font-size: 9.5rem; line-height: 1; color: var(--ink);
    opacity: .05; pointer-events: none; user-select: none;
  }
  h2 {
    font-family: var(--display); text-transform: uppercase; font-style: italic;
    font-size: 1.7rem; letter-spacing: .1em; margin: 0; line-height: 1;
  }
  .sub { font-size: .88rem; color: var(--muted); margin: .35rem 0 .9rem; }
  .note { font-size: .8rem; color: var(--muted); margin: 0; }

  .day-head { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  .day-tag {
    font-family: var(--display); text-transform: uppercase; letter-spacing: .12em;
    font-size: .85rem; background: var(--pc, var(--accent)); color: #101014;
    border-radius: 6px; padding: .22rem .6rem .16rem; transform: skewX(-8deg);
    border: 0; cursor: default;
  }
  .edit-on .day-tag, .edit-on h2.d-tit { cursor: pointer; }
  .edit-on h2.d-tit { border-bottom: 1px dashed var(--pc, var(--accent)); }
  .day-count {
    margin-left: auto; font-family: var(--display); font-size: 1.15rem; letter-spacing: .07em;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .day-count b { color: var(--pc, var(--accent)); font-weight: 400; }
  .bar { height: 5px; border-radius: 99px; background: var(--soft); margin: .7rem 0 .9rem; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; border-radius: 99px; background: var(--pc, var(--accent)); transition: width .45s cubic-bezier(.2,.8,.2,1); }

  .strip {
    margin-top: .9rem; border-radius: 12px; padding: .65rem .9rem; font-size: .9rem;
    background: repeating-linear-gradient(-55deg, transparent 0 12px, color-mix(in srgb, var(--pc, var(--accent)) 7%, transparent) 12px 24px),
                color-mix(in srgb, var(--pc, var(--accent)) 10%, var(--card));
  }
  .strip b {
    font-family: var(--display); font-weight: 400; letter-spacing: .12em; text-transform: uppercase;
    color: var(--pc, var(--accent)); margin-right: .4rem; font-size: .8rem;
  }

  /* ---------- Rutinas ---------- */
  .rut-head { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; margin: .4rem 0 0; }
  .rut-name {
    font-family: var(--display); font-style: italic; text-transform: uppercase;
    font-size: 2.1rem; line-height: 1; margin: 0; color: var(--pc, var(--accent));
    letter-spacing: .05em;
  }
  .rut-actions { margin-left: auto; display: flex; gap: .4rem; }

  .peso-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-top: .6rem; }
  .peso-row label { font-size: .8rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .peso-input {
    width: 90px; background: var(--soft); border: 1px solid var(--line); color: var(--ink);
    border-radius: 10px; padding: .45rem .6rem; font-family: var(--display); font-size: 1.3rem;
    letter-spacing: .05em; text-align: center; font-variant-numeric: tabular-nums;
  }
  .peso-input:focus { outline: 2px solid var(--accent); border-color: transparent; }

  /* ---------- Macros ---------- */
  .macros { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; margin-top: .9rem; }
  @media (min-width: 520px) { .macros { grid-template-columns: repeat(4, 1fr); } }
  .macro { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: .7rem .8rem .6rem; }
  .macro b {
    display: block; font-family: var(--display); font-weight: 400; font-size: 1.9rem;
    line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: .03em;
  }
  .macro span { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: .2rem; }
  .macro small { display: block; font-size: .68rem; color: var(--muted); margin-top: .1rem; }

  /* ---------- Ejercicios ---------- */
  ul.ex-list { list-style: none; margin: 0; padding: 0; }
  .ex { border-top: 1px solid var(--line); padding: .55rem 0; }
  .ex:first-child { border-top: 0; }
  .ex-main { display: flex; align-items: center; gap: .6rem; }
  .ex-num {
    font-family: var(--display); font-style: italic; font-size: 1.2rem;
    color: var(--muted); opacity: .55; min-width: 1.3ch; text-align: right;
  }
  .check {
    flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line);
    background: transparent; cursor: pointer; padding: 0; display: grid; place-items: center;
    color: transparent; font-size: .85rem; font-weight: 800; transition: background .2s, border-color .2s;
  }
  .ex-thumb {
    flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; object-fit: contain; cursor: pointer;
  }
  .ex-info { flex: 1; min-width: 0; cursor: pointer; }
  .ex-name { font-weight: 650; font-size: .92rem; display: block; }
  .ex-meta { display: block; font-size: .72rem; color: var(--muted); }
  .ex-sets {
    font-family: var(--display); font-size: 1.05rem; letter-spacing: .06em;
    color: var(--pc, var(--accent)); white-space: nowrap; font-variant-numeric: tabular-nums;
    background: transparent; border: 1px dashed transparent; border-radius: 8px;
    padding: .15rem .4rem; cursor: pointer;
  }
  .edit-on .ex-sets { border-color: var(--line); }
  .ex.done .ex-name, .ex.done .ex-meta, .ex.done .ex-num { opacity: .38; }
  .ex.done .ex-name { text-decoration: line-through; }
  .ex.done .check { background: var(--pc, var(--accent)); border-color: var(--pc, var(--accent)); color: #101014; animation: pop .3s; }

  .ex-ctrl { display: flex; gap: .35rem; }
  .ex-ctrl button {
    border: 1px solid var(--line); background: var(--soft); color: var(--ink);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: .8rem; padding: 0;
    transition: border-color .2s, color .2s;
  }
  .ex-ctrl button:active { border-color: var(--pc, var(--accent)); color: var(--pc, var(--accent)); }
  .ex-ctrl .rm { color: #FF6B5A; }

  .day-actions { display: flex; gap: .5rem; margin-top: .8rem; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); background: var(--soft); color: var(--ink);
    border-radius: 10px; padding: .5rem .9rem .42rem; cursor: pointer; font-family: var(--display);
    text-transform: uppercase; letter-spacing: .08em; font-size: .88rem;
    transition: background .2s, border-color .2s, color .2s, transform .12s;
  }
  .btn:active { transform: scale(.95); }
  .btn.primary { background: var(--pc, var(--accent)); border-color: var(--pc, var(--accent)); color: #101014; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: #FF6B5A; }
  .edit-toggle { margin-left: auto; }
  .day-head .edit-toggle { margin-left: 0; }
  .empty-day { font-size: .85rem; color: var(--muted); padding: .5rem 0; }

  /* ---------- Crear rutina (builder) ---------- */
  .form-row { margin-top: .8rem; }
  .form-row label { display: block; font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: .35rem; }
  .name-input {
    width: 100%; background: var(--soft); border: 1px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: .6rem .9rem; font-size: .95rem; font-family: inherit;
  }
  .name-input:focus { outline: 2px solid var(--accent); border-color: transparent; }

  .bd-day-list { list-style: none; margin: .55rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
  .bd-day-list li {
    display: flex; align-items: center; gap: .55rem; padding: .4rem .55rem;
    background: var(--soft); border: 1px solid var(--line); border-radius: 12px;
  }
  .bd-empty { font-size: .84rem; color: var(--muted); background: var(--soft); border-radius: 10px; padding: .6rem .8rem; margin-top: .6rem; }
  .chip .n { opacity: .7; font-weight: 400; }
  .dias-pick { display: grid; grid-template-columns: repeat(7, 1fr); gap: .4rem; max-width: 420px; }
  .dias-pick button {
    aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--soft);
    color: var(--ink); font-family: var(--display); font-size: 1.35rem; cursor: pointer;
    display: grid; place-items: center; padding: 0;
    transition: background .2s, border-color .2s, color .2s, transform .12s;
  }
  .dias-pick button:active { transform: scale(.88); }
  .dias-pick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #101014; }
  .day-head h2[data-bd-rename] { cursor: pointer; border-bottom: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); }

  /* ---------- Catálogo (barra lateral de grupos) ---------- */
  .search {
    width: 100%; background: var(--soft); border: 1px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: .6rem .9rem; font-size: .95rem; font-family: inherit;
  }
  .search:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .chips { display: flex; gap: .4rem; overflow-x: auto; padding: .6rem .1rem .2rem; scrollbar-width: none; flex-wrap: wrap; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: .32rem .8rem .26rem; cursor: pointer; font-size: .8rem; font-weight: 700;
    letter-spacing: .04em; transition: background .2s, border-color .2s, color .2s;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #101014; }

  .split { display: flex; gap: .6rem; align-items: flex-start; margin-top: .7rem; }
  .side {
    flex: none; width: 152px; position: sticky; top: 66px; display: flex; flex-direction: column;
    gap: .35rem; max-height: calc(100vh - 90px); overflow-y: auto;
  }
  .side button {
    display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: .5rem .6rem .44rem; font-size: .8rem; font-weight: 650;
    letter-spacing: .02em; cursor: pointer; transition: background .2s, color .2s, border-color .2s;
  }
  .side button small {
    flex: none; font-weight: 700; font-size: .64rem; color: var(--muted);
    background: var(--soft); border-radius: 999px; padding: .14rem .5rem .1rem;
    font-variant-numeric: tabular-nums;
  }
  .side button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #101014; }
  .side button[aria-pressed="true"] small { background: rgba(0,0,0,.25); color: #FFE9E2; }
  @media (hover: hover) { .side button:not([aria-pressed="true"]):hover { border-color: var(--accent); } }
  .split-main { flex: 1; min-width: 0; }

  .cat-count { font-size: .78rem; color: var(--muted); margin: .3rem 0 .4rem; }
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .65rem; }
  .cat-card {
    position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    cursor: pointer; transition: transform .15s, border-color .2s; text-align: left; padding: 0; color: var(--ink);
    display: flex; flex-direction: column;
  }
  .cat-card:active { transform: scale(.96); }
  .cat-card.added { border-color: var(--accent); }
  @media (hover: hover) {
    .cat-card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); transform: translateY(-2px); }
  }
  /* Medios del dataset a 180×180: nunca estirar por encima del tamaño nativo */
  .cat-card .imgbox {
    display: grid; place-items: center; background: #fff; aspect-ratio: 1/1;
    padding: .4rem; border-bottom: 1px solid var(--line);
  }
  .cat-card .imgbox img {
    width: 100%; max-width: 172px; aspect-ratio: 1/1; object-fit: contain; display: block;
    image-rendering: -webkit-optimize-contrast;
  }
  .cat-card .cc-body { padding: .55rem .6rem .7rem; text-align: center; }
  .cat-card .cc-name {
    font-size: .78rem; font-weight: 650; line-height: 1.3; min-height: 2.6em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cat-card .cc-meta {
    font-size: .66rem; color: var(--muted); display: block; margin-top: .3rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-info {
    position: absolute; left: .4rem; top: .4rem; width: 27px; height: 27px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(16,16,20,.62); color: #fff; font-size: .8rem;
    cursor: pointer; z-index: 2; display: grid; place-items: center; padding: 0;
  }
  .cc-add {
    position: absolute; right: .4rem; top: .4rem; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #101014; display: grid; place-items: center;
    font-weight: 800; font-size: .95rem; pointer-events: none;
  }
  .more-row { display: flex; justify-content: center; margin-top: .9rem; }

  /* Móvil: grupos como píldoras horizontales y ejercicios en filas a todo el ancho */
  @media (max-width: 640px) {
    .split { flex-direction: column; gap: .2rem; }
    .side {
      position: static; width: 100%; max-height: none; flex-direction: row;
      overflow-x: auto; overflow-y: hidden; gap: .35rem; padding: .15rem 0 .5rem;
      flex-wrap: nowrap; scrollbar-width: none;
    }
    .side::-webkit-scrollbar { display: none; }
    .side button {
      display: flex; align-items: baseline; gap: .35rem; border-radius: 999px;
      padding: .42rem .8rem .36rem; font-size: .8rem; white-space: nowrap;
    }
    .side button small { font-size: .62rem; }
    .cat-grid { display: flex; flex-direction: column; gap: .45rem; }
    .cat-card { flex-direction: row; align-items: center; gap: .6rem; padding: .45rem .55rem; border-radius: 12px; width: 100%; }
    .cat-card .imgbox { width: 58px; height: 58px; flex: none; border-radius: 9px; overflow: hidden; order: 0; padding: 0; border-bottom: 0; border: 1px solid var(--line); }
    .cat-card .imgbox img { max-width: none; width: 100%; height: 100%; }
    .cat-card .cc-body { flex: 1; min-width: 0; padding: 0; order: 1; text-align: left; }
    .cat-card .cc-name { font-size: .84rem; min-height: 0; }
    .cat-card .cc-meta { font-size: .7rem; margin-top: .12rem; }
    .cc-info {
      position: static; order: 2; flex: none; width: 32px; height: 32px;
      background: var(--soft); color: var(--muted); border-color: var(--line); font-size: .85rem;
    }
    .cc-add { position: static; order: 3; flex: none; width: 32px; height: 32px; font-size: 1rem; }
  }

  /* ---------- Sello + celebración ---------- */
  .stamp {
    position: absolute; right: .9rem; top: .9rem; transform: rotate(7deg);
    font-family: var(--display); text-transform: uppercase; font-style: italic;
    letter-spacing: .1em; font-size: 1rem; color: var(--pc, var(--accent));
    border: 2.5px solid var(--pc, var(--accent)); border-radius: 8px; padding: .2rem .6rem .12rem;
    animation: stampIn .55s cubic-bezier(.3,1.4,.4,1) backwards; z-index: 3;
  }
  .card.celebrate::after {
    content: ''; position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
    z-index: 4; animation: glowPulse 1.15s ease-out forwards;
  }
  .card.celebrate .bar i { animation: barFlash 1s ease; }
  .cf-layer { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
  .cf { position: absolute; display: block; animation: cfall 1.6s both; }

  /* ---------- Modal ---------- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90;
    display: grid; place-items: end center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    animation: fadeIn .2s;
  }
  .modal {
    width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 22px 22px 0 0;
    padding: 1.1rem 1.1rem 1.4rem; animation: slideUp .3s cubic-bezier(.2,.8,.2,1);
  }
  @media (min-width: 600px) { .modal-bg { place-items: center; } .modal { border-radius: 22px; } }
  .modal-head { display: flex; align-items: flex-start; gap: .7rem; }
  .modal-head h3 { font-family: var(--display); text-transform: uppercase; font-style: italic; font-size: 1.35rem; letter-spacing: .06em; margin: 0; line-height: 1.05; flex: 1; }
  .modal-close {
    flex: none; border: 1px solid var(--line); background: var(--soft); color: var(--ink);
    border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: .95rem;
  }
  .badges { display: flex; flex-wrap: wrap; gap: .35rem; margin: .6rem 0; }
  .badge {
    font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .6rem;
    color: var(--muted);
  }
  .badge.hl { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .modal-gif {
    width: min(100%, 240px); margin: .3rem auto; display: block; border-radius: 14px;
    background: #fff; padding: .5rem; image-rendering: -webkit-optimize-contrast;
    filter: url(#nitidez) contrast(1.02);
  }
  .steps { margin: .7rem 0 0; padding-left: 1.2rem; }
  .steps li { margin: .4rem 0; font-size: .89rem; }
  .steps li::marker { color: var(--accent); font-weight: 700; }
  .attr { font-size: .68rem; color: var(--muted); margin-top: .8rem; }
  .attr a { color: var(--muted); }
  .addto { border-top: 1px solid var(--line); margin-top: 1rem; padding-top: .9rem; }
  .addto h4 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .1em; font-size: .9rem; margin: 0 0 .5rem; color: var(--muted); }
  .addto .chips { padding: .2rem 0; }
  .quickadd { width: 100%; margin-bottom: .6rem; }

  /* ---------- Diálogos ---------- */
  .dlg-bg { place-items: center; z-index: 140; }
  .dialog {
    width: min(92vw, 400px); background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 1.2rem; animation: slideUp .25s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .dialog h3 { font-family: var(--display); text-transform: uppercase; font-style: italic; letter-spacing: .07em; font-size: 1.3rem; margin: 0 0 .5rem; }
  .dialog p { font-size: .88rem; color: var(--muted); margin: .2rem 0 .9rem; }
  .dialog .name-input { margin-bottom: .9rem; }
  .dialog .row { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
  .dialog .big { font-size: 2.8rem; text-align: center; margin: .1rem 0 .2rem; animation: pop .5s .15s backwards; }
  .dialog .resumen { display: flex; gap: .5rem; justify-content: center; margin: .6rem 0 .9rem; flex-wrap: wrap; }
  .dialog .resumen span {
    font-family: var(--display); font-size: 1rem; letter-spacing: .06em; text-transform: uppercase;
    background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: .35rem .7rem .28rem;
    color: var(--pc, var(--accent));
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 5.4rem; transform: translateX(-50%); z-index: 160;
    background: var(--ink); color: #101014; font-weight: 700; font-size: .85rem;
    border-radius: 999px; padding: .55rem 1.1rem; box-shadow: var(--shadow);
    animation: toastIn .25s, fadeOut .3s 2.2s forwards; max-width: 90vw; text-align: center;
  }

  /* ---------- Timer ---------- */
  #timerbar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; padding: .6rem 1rem 1.1rem; pointer-events: none; z-index: 50; }
  .timer {
    pointer-events: auto; display: flex; gap: .4rem; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: .4rem .5rem; box-shadow: var(--shadow);
  }
  .timer .tlabel { font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: .72rem; color: var(--muted); padding: 0 .25rem 0 .55rem; }
  .timer button[data-t] {
    border: 1px solid var(--line); background: var(--soft); color: var(--ink);
    border-radius: 999px; padding: .4rem .7rem .32rem; cursor: pointer;
    font-family: var(--display); font-size: .95rem; letter-spacing: .05em;
    transition: transform .12s, background .2s;
  }
  .timer button[data-t]:active { transform: scale(.9); }
  .ring {
    width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), var(--line) 0);
  }
  .ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--card); }
  .ring span { position: relative; font-family: var(--display); font-size: .95rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .timer .stop { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: .8rem; }
  .timer.flash { animation: flash .4s ease 3; }

  /* ---------- Animaciones ---------- */
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop { 40% { transform: scale(1.25); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } }
  @keyframes toastIn { from { transform: translate(-50%, 12px); opacity: 0; } }
  @keyframes stampIn {
    0% { opacity: 0; transform: rotate(-16deg) scale(2.8); filter: blur(3px); }
    55% { opacity: 1; transform: rotate(9deg) scale(.9); filter: blur(0); }
    78% { transform: rotate(5.5deg) scale(1.08); }
    100% { transform: rotate(7deg) scale(1); }
  }
  @keyframes flash { 50% { background: color-mix(in srgb, var(--accent) 22%, var(--card)); } }
  @keyframes glowPulse {
    0% { box-shadow: inset 0 0 0 0 transparent; opacity: 1; }
    20% { box-shadow: inset 0 0 0 3px var(--pc, var(--accent)), inset 0 0 60px color-mix(in srgb, var(--pc, var(--accent)) 28%, transparent); }
    100% { box-shadow: inset 0 0 0 3px transparent, inset 0 0 80px transparent; opacity: 0; }
  }
  @keyframes barFlash { 30% { filter: brightness(1.9); } }
  @keyframes cfall {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; animation-timing-function: ease-out; }
    30% { transform: translate(calc(var(--dx) * .5), var(--up)) rotate(calc(var(--rot) * .5)); opacity: 1; animation-timing-function: ease-in; }
    80% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--down)) rotate(var(--rot)); opacity: 0; }
  }

  button:focus-visible, .tab:focus-visible, .search:focus-visible, .name-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="kicker">Arma tu rutina · a tu medida</p>
    <h1>Gym<br><em>Final</em></h1>
    <div class="stripes"></div>
    <p class="ticker"><span><b>1299</b> ejercicios</span><span><b>∞</b> rutinas</span><span><b>100%</b> personalizable</span></p>
  </header>
</div>

<div class="tabs-wrap">
  <div class="topbar">
    <button class="menu-btn" id="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav class="tabs" id="tabs" aria-label="Elegir rutina"></nav>
  </div>
</div>

<div class="edge-zone" id="edge-zone" aria-hidden="true"></div>
<div class="edge-hint" id="edge-hint" aria-hidden="true"></div>
<div class="drawer-bg" id="drawer-bg"></div>
<aside class="drawer" id="drawer" aria-label="Menú principal">
  <p class="dh">Gym<br><em>Final</em></p>
  <button data-sec="rutinas"><span class="ic">🏋️</span><span>Rutinas<small>Tus rutinas y la de prueba</small></span></button>
  <button data-sec="catalogo"><span class="ic">≡</span><span>Catálogo<small>1299 ejercicios por músculo</small></span></button>
  <button data-sec="macros"><span class="ic">%</span><span>Macros<small>Proteína, calorías, grasas, carbos</small></span></button>
  <p class="dnote">Ejercicios: dataset hasaneyldrm · Medios © Gym visual</p>
</aside>

<div class="wrap"><main id="app"></main></div>

<div id="timerbar">
  <div class="timer" id="timer">
    <span class="tlabel">Descanso</span>
    <button data-t="60">60"</button>
    <button data-t="90">90"</button>
    <button data-t="120">120"</button>
    <div class="ring" id="ring"><span id="count">—</span></div>
    <button class="stop" id="stopBtn" hidden aria-label="Parar cronómetro">■</button>
  </div>
</div>

<div id="modal-root"></div>
<div id="dlg-root"></div>

<!-- Filtro de nitidez suave para los GIF (fuente 180×180 mostrada más grande) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="nitidez">
    <feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -0.3 0 -0.3 2.2 -0.3 0 -0.3 0"/>
  </filter>
</svg>

<script src="./data/ejercicios.js"></script>
<script>
'use strict';

/* ---------- Datos base ---------- */

const MEDIA = 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/';
const EX = {};
window.CATALOGO.forEach(e => { EX[e.id] = e; });
const imgURL = e => MEDIA + 'images/' + e.m + '.jpg';
const gifURL = e => MEDIA + 'videos/' + e.m + '.gif';

const GRUPOS = [
  { key: 'chest', nombre: 'Pecho' },
  { key: 'back', nombre: 'Espalda' },
  { key: 'shoulders', nombre: 'Hombros' },
  { key: 'upper arms', nombre: 'Brazos' },
  { key: 'lower arms', nombre: 'Antebrazos' },
  { key: 'upper legs', nombre: 'Piernas' },
  { key: 'lower legs', nombre: 'Pantorrillas' },
  { key: 'waist', nombre: 'Core' },
  { key: 'cardio', nombre: 'Cardio' },
];
const grupoNombre = key => { const g = GRUPOS.find(x => x.key === key); return g ? g.nombre : key; };
const COUNTS = {};
window.CATALOGO.forEach(e => { COUNTS[e.bp] = (COUNTS[e.bp] || 0) + 1; });

const EQ_ES = {
  'body weight': 'Peso corporal', 'cable': 'Polea', 'leverage machine': 'Máquina',
  'assisted': 'Asistido', 'band': 'Banda', 'resistance band': 'Banda',
  'barbell': 'Barra', 'ez barbell': 'Barra EZ', 'dumbbell': 'Mancuernas',
  'kettlebell': 'Kettlebell', 'medicine ball': 'Balón medicinal', 'stability ball': 'Pelota',
  'rope': 'Soga', 'smith machine': 'Smith', 'weighted': 'Con peso', 'sled machine': 'Prensa',
};
const eqNombre = eq => EQ_ES[eq] || eq;

const MUSC_ES = {
  'abs': 'abdomen', 'pectorals': 'pectorales', 'lats': 'dorsales', 'delts': 'deltoides',
  'quads': 'cuádriceps', 'hamstrings': 'femorales', 'glutes': 'glúteos', 'biceps': 'bíceps',
  'triceps': 'tríceps', 'calves': 'pantorrillas', 'forearms': 'antebrazos', 'traps': 'trapecios',
  'spine': 'columna', 'cardiovascular system': 'cardio', 'adductors': 'aductores',
  'abductors': 'abductores', 'serratus anterior': 'serrato', 'upper back': 'espalda alta',
  'levator scapulae': 'cuello', 'obliques': 'oblicuos', 'hip flexors': 'flexores de cadera',
  'lower back': 'lumbar', 'shoulders': 'hombros', 'rotator cuff': 'manguito rotador',
};
const muscNombre = t => MUSC_ES[t] || t;

const PALETA = ['#3E8BFF', '#FFD700', '#35D07F', '#B08CFF', '#FF6FA5', '#6B8E23', '#00C2D1', '#FF8C42'];

/* Rutina de ejemplo — empuje / jalón / pierna. Se puede editar y restaurar. */
const RUTINA_TEST = {
  id: 'test', nombre: 'Rutina Test', color: '#9AA0A6',
  dias: [
    { id: 'd1', dia: 'Día 1', titulo: 'Empuje (test)', items: [
      { ex: '0025', alias: 'Press de banca con barra', sets: '4×8' },
      { ex: '2137', alias: 'Press Arnold con mancuernas', sets: '3×10' },
      { ex: '0241', alias: 'Extensión de tríceps en polea (barra V)', sets: '3×12' },
      { ex: '0178', alias: 'Elevaciones laterales en polea', sets: '3×15' },
    ]},
    { id: 'd2', dia: 'Día 2', titulo: 'Jalón (test)', items: [
      { ex: '0017', alias: 'Dominadas asistidas', sets: '3×8' },
      { ex: '0027', alias: 'Remo con barra', sets: '4×10' },
      { ex: '0313', alias: 'Curl martillo con mancuernas', sets: '3×12' },
      { ex: '0472', alias: 'Elevación de piernas colgado', sets: '3×12' },
    ]},
    { id: 'd3', dia: 'Día 3', titulo: 'Pierna (test)', items: [
      { ex: '0032', alias: 'Peso muerto con barra', sets: '3×5' },
      { ex: '1760', alias: 'Sentadilla goblet con mancuerna', sets: '3×12' },
      { ex: '1459', alias: 'Peso muerto rumano con mancuernas', sets: '3×10' },
      { ex: '0605', alias: 'Elevación de talones en máquina', sets: '4×15' },
      { ex: '1160', alias: 'Burpees', sets: '3×10' },
    ]},
  ],
};

/* ---------- Macros ----------
   Proteína = peso × 2 (g) · Calorías = proteína × 14 (kcal)
   Grasas   = peso × 0.7 (g) · Carbos = (kcal − prot×4 − grasas×9) ÷ 4 (g) */
function macros(peso) {
  const prot = Math.round(peso * 2);
  const kcal = prot * 14;
  const grasa = Math.round(peso * 0.7);
  const carbs = Math.max(0, Math.round((kcal - prot * 4 - grasa * 9) / 4));
  return { prot, kcal, grasa, carbs };
}

/* ---------- Estado ---------- */

const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

const state = {
  seccion: store.get('gf.seccion', 'rutinas'),
  rutSel: store.get('gf.rutSel', 'test'),
  catGrupo: 'todos',
  catQ: '',
  catLimit: 36,
  editDays: {},
  addTarget: null,
  builder: null,
};
if (!['rutinas', 'catalogo', 'macros'].includes(state.seccion)) state.seccion = 'rutinas';

function hoy() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const doneKey = key => 'gf.done.' + key + '.' + hoy();

/* Rutinas: la Test vive en su propia clave (restaurable); las creadas, en gf.rutinas */
const rutinaTest = () => store.get('gf.rutina.test', null) || JSON.parse(JSON.stringify(RUTINA_TEST));
const misRutinas = () => store.get('gf.rutinas', []);
const todasRutinas = () => [rutinaTest()].concat(misRutinas());
const getRutina = rid => rid === 'test' ? rutinaTest() : misRutinas().find(r => r.id === rid);
function saveRutina(r) {
  if (r.id === 'test') { store.set('gf.rutina.test', r); return; }
  const list = misRutinas();
  const i = list.findIndex(x => x.id === r.id);
  if (i >= 0) list[i] = r; else list.push(r);
  store.set('gf.rutinas', list);
}
function deleteRutina(rid) {
  if (rid === 'test') { store.del('gf.rutina.test'); return; }
  store.set('gf.rutinas', misRutinas().filter(r => r.id !== rid));
}
if (state.rutSel !== 'crear' && !getRutina(state.rutSel)) state.rutSel = 'test';

/* Borrador del creador de rutinas (sobrevive si cambias de sección) */
function nuevoBorrador() {
  return { fase: 1, nombre: '', nDias: 3, dias: [], diaSel: 'd1', grupo: 'todos', q: '', limit: 36 };
}
function borrador() {
  if (!state.builder) state.builder = store.get('gf.borrador', null) || nuevoBorrador();
  return state.builder;
}
function saveBorrador() { if (state.builder) store.set('gf.borrador', state.builder); }
function limpiarBorrador() { state.builder = null; store.del('gf.borrador'); }

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------- Menú lateral ---------- */

const drawerEl = document.getElementById('drawer');
const drawerBg = document.getElementById('drawer-bg');
const menuBtn = document.getElementById('menu-btn');
const edgeZone = document.getElementById('edge-zone');
const edgeHint = document.getElementById('edge-hint');
let cierreTimer = null;

/* modal=true: con fondo oscuro (☰ o táctil). modal=false: por hover en el borde. */
function setDrawer(open, modal) {
  drawerEl.classList.toggle('open', open);
  drawerBg.classList.toggle('open', open && modal !== false);
  menuBtn.setAttribute('aria-expanded', String(open));
  edgeHint.classList.toggle('oculto', open);
}
menuBtn.addEventListener('click', () => setDrawer(!drawerEl.classList.contains('open'), true));
drawerBg.addEventListener('click', () => setDrawer(false));

/* Aparece al acercar el puntero al borde izquierdo; se esconde al alejarlo */
edgeZone.addEventListener('mouseenter', () => {
  clearTimeout(cierreTimer);
  setDrawer(true, false);
});
drawerEl.addEventListener('mouseenter', () => clearTimeout(cierreTimer));
drawerEl.addEventListener('mouseleave', () => {
  cierreTimer = setTimeout(() => setDrawer(false), 250);
});
edgeZone.addEventListener('mouseleave', () => {
  cierreTimer = setTimeout(() => { if (!drawerEl.matches(':hover')) setDrawer(false); }, 350);
});
edgeZone.addEventListener('touchstart', () => setDrawer(true, true), { passive: true });
drawerEl.addEventListener('click', e => {
  const b = e.target.closest('[data-sec]');
  if (!b) return;
  state.seccion = b.dataset.sec;
  state.addTarget = null;
  state.editDays = {};
  store.set('gf.seccion', state.seccion);
  setDrawer(false);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---------- Render: barra superior ---------- */

const tabsEl = document.getElementById('tabs');
const appEl = document.getElementById('app');

function renderTabs() {
  drawerEl.querySelectorAll('[data-sec]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sec === state.seccion)));
  if (state.seccion !== 'rutinas') {
    tabsEl.innerHTML = '<span class="sec-label">' + (state.seccion === 'catalogo' ? 'Catálogo' : 'Macros') + '</span>';
    return;
  }
  tabsEl.innerHTML =
    todasRutinas().map(r =>
      '<button class="tab" data-rut="' + r.id + '" style="--tc:' + r.color + '" aria-pressed="' + (state.rutSel === r.id) + '"><span class="dot"></span>' + esc(r.nombre) + '</button>'
    ).join('') +
    '<button class="tab" data-rut="crear" aria-pressed="' + (state.rutSel === 'crear') + '">＋ Crear</button>';
}

/* ---------- Render: rutinas ---------- */

function itemRow(it, key, idx, editing) {
  const e = EX[it.ex];
  if (!e) return '';
  const done = (store.get(doneKey(key), [])).includes(idx);
  const nombre = it.alias || e.n;
  const meta = muscNombre(e.t) + ' · ' + eqNombre(e.eq);
  return '<li class="ex' + (done ? ' done' : '') + '" data-day="' + key + '" data-idx="' + idx + '">' +
    '<div class="ex-main">' +
    '<span class="ex-num">' + (idx + 1) + '</span>' +
    (!editing ? '<button class="check" aria-label="Marcar hecho: ' + esc(nombre) + '" aria-pressed="' + done + '">✓</button>' : '') +
    '<img class="ex-thumb" loading="lazy" src="' + imgURL(e) + '" alt="" data-open="' + e.id + '">' +
    '<span class="ex-info" data-open="' + e.id + '">' +
    '<span class="ex-name">' + esc(nombre) + '</span>' +
    '<span class="ex-meta">' + esc(meta) + '</span>' +
    '</span>' +
    '<button class="ex-sets" data-sets title="Editar series">' + esc(it.sets) + '</button>' +
    (editing ?
      '<span class="ex-ctrl">' +
      '<button data-mv="-1" aria-label="Subir">▲</button>' +
      '<button data-mv="1" aria-label="Bajar">▼</button>' +
      '<button class="rm" data-rm aria-label="Quitar">✕</button>' +
      '</span>' : '') +
    '</div>' +
    '</li>';
}

function dayCard(rut, day) {
  const key = rut.id + '.' + day.id;
  const editing = !!state.editDays[key];
  const total = day.items.length;
  const done = store.get(doneKey(key), []).length;
  return '<section style="--pc:' + rut.color + '" class="card' + (editing ? ' edit-on' : '') + '" data-daycard="' + key + '" data-total="' + total + '">' +
    '<span class="wm">' + esc(day.id.replace('d', '')) + '</span>' +
    (total > 0 && done >= total
      ? '<div class="stamp" data-stamp="' + key + '">Completado</div>'
      : '<div class="stamp" data-stamp="' + key + '" hidden>Completado</div>') +
    '<div class="day-head">' +
    '<span class="day-tag" data-ren-dia title="' + (editing ? 'Tocar para renombrar' : '') + '">' + esc(day.dia) + '</span>' +
    '<h2 class="d-tit" data-ren-tit>' + esc(day.titulo) + '</h2>' +
    (total ? '<span class="day-count" data-count="' + key + '"><b>' + done + '</b>/' + total + '</span>' : '') +
    '</div>' +
    (total ? '<div class="bar"><i data-bar="' + key + '" style="width:' + Math.round(done / total * 100) + '%"></i></div>' : '') +
    (total
      ? '<ul class="ex-list">' + day.items.map((it, i) => itemRow(it, key, i, editing)).join('') + '</ul>'
      : '<p class="empty-day">Sin ejercicios aún — toca «✎ Editar» y luego «+ Agregar ejercicio» para elegirlos del catálogo.</p>') +
    '<div class="day-actions">' +
    (editing ? '<button class="btn primary" data-add="' + key + '">+ Agregar ejercicio</button>' : '') +
    '<button class="btn ghost edit-toggle" data-edit="' + key + '">' + (editing ? '✓ Listo' : '✎ Editar') + '</button>' +

/* ---------- Catálogo: helpers compartidos ---------- */

function filtrar(grupo, q) {
  const t = (q || '').trim().toLowerCase();
  return window.CATALOGO.filter(e => {
    if (grupo !== 'todos' && e.bp !== grupo) return false;
    if (!t) return true;
    return e.n.toLowerCase().includes(t) || (e.t || '').toLowerCase().includes(t) ||
      muscNombre(e.t).toLowerCase().includes(t) || eqNombre(e.eq).toLowerCase().includes(t);
  });
}

function sideBtns(sel, attr) {
  return '<button ' + attr + '="todos" aria-pressed="' + (sel === 'todos') + '">Todos<small>' + window.CATALOGO.length + '</small></button>' +
    GRUPOS.map(g =>
      '<button ' + attr + '="' + g.key + '" aria-pressed="' + (sel === g.key) + '">' + g.nombre + '<small>' + (COUNTS[g.key] || 0) + '</small></button>'
    ).join('');
}

function catGridHTML(shown) {
  return shown.map(e =>
    '<button class="cat-card" data-open="' + e.id + '">' +
    '<span class="imgbox"><img loading="lazy" src="' + imgURL(e) + '" alt=""></span>' +
    '<span class="cc-body"><span class="cc-name">' + esc(e.n) + '</span>' +
    '<span class="cc-meta">' + esc(muscNombre(e.t)) + ' · ' + esc(eqNombre(e.eq)) + '</span></span>' +
    '</button>'
  ).join('');
}

function moreRowHTML(rest, attr) {
  return '<div class="more-row"><button class="btn" ' + attr + '>Mostrar más (' + rest + ' restantes)</button></div>';
}

function renderCatalogo() {
  const list = filtrar(state.catGrupo, state.catQ);

  return '<section class="card" id="cat-browser"><span class="wm">≡</span><h2>Catálogo</h2>' +

function refreshCatGrid() {
  const card = appEl.querySelector('#cat-browser');

  const shown = list.slice(0, state.catLimit);

function render() {
  renderTabs();
  if (state.seccion === 'catalogo') appEl.innerHTML = renderCatalogo();
  else if (state.seccion === 'macros') appEl.innerHTML = renderMacros();

}

const dlgRoot = document.getElementById('dlg-root');
let dlgCb = null;

function dlgClose() { dlgRoot.innerHTML = ''; dlgCb = null; }

function dlgInput(titulo, valor, cb, hint) {
  dlgCb = cb;
  dlgRoot.innerHTML = '<div class="modal-bg dlg-bg" data-dlg-bg><div class="dialog">' +
    '<h3>' + esc(titulo) + '</h3>' +
    (hint ? '<p>' + esc(hint) + '</p>' : '') +

    '</div></div>';
  const inp = dlgRoot.querySelector('#dlg-in');
  inp.focus();
  inp.select();
}

function dlgConfirm(titulo, msg, cb, txtOk) {
  dlgCb = cb;
  dlgRoot.innerHTML = '<div class="modal-bg dlg-bg" data-dlg-bg><div class="dialog">' +
    '<h3>' + esc(titulo) + '</h3>' +
    '<p>' + esc(msg) + '</p>' +
    '<div class="row"><button class="btn ghost" data-dlg-cancel>Cancelar</button><button class="btn primary" data-dlg-ok>' + esc(txtOk || 'Confirmar') + '</button></div>' +

}

function dlgExito(rut) {
  const total = rut.dias.reduce((a, d) => a + d.items.length, 0);
  dlgCb = null;
  dlgRoot.innerHTML = '<div class="modal-bg dlg-bg" data-dlg-bg><div class="dialog" style="--pc:' + rut.color + '">' +
    '<p class="big">🎉</p>' +
    '<h3 style="text-align:center">¡Rutina creada!</h3>' +
    '<p style="text-align:center">«' + esc(rut.nombre) + '» ya tiene su propia pestaña arriba.</p>' +
    '<div class="resumen"><span>' + rut.dias.length + ' día' + (rut.dias.length === 1 ? '' : 's') + '</span><span>' + total + ' ejercicios</span></div>' +
    '<div class="row" style="justify-content:center"><button class="btn primary" data-dlg-cancel>¡A entrenar!</button></div>' +
    '</div></div>';
  celebrate(dlgRoot.querySelector('.dialog'), rut.color);
}

dlgRoot.addEventListener('click', e => {
  if (e.target.matches('[data-dlg-bg]') || e.target.closest('[data-dlg-cancel]')) { dlgClose(); return; }
  if (e.target.closest('[data-dlg-ok]')) {
    const inp = dlgRoot.querySelector('#dlg-in');
    const cb = dlgCb;
    dlgClose();
    if (cb) cb(inp ? inp.value : true);
  }
});
dlgRoot.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'dlg-in') {
    const cb = dlgCb;
    const v = e.target.value;
    dlgClose();
    if (cb) cb(v);
  }
});

function closeModal() {
  modalRoot.innerHTML = '';
  delete modalRoot.dataset.ex;
  document.body.style.overflow = '';
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function addExTo(rid, dayId, exId) {
  const rut = getRutina(rid);
  if (!rut) return false;
  const day = rut.dias.find(d => d.id === dayId);
  if (!day || !EX[exId]) return false;
  day.items.push({ ex: exId, alias: '', sets: '3×12' });
  saveRutina(rut);
  toast('✓ Agregado a ' + day.dia + ' de «' + rut.nombre + '»');
  return true;
}

function addExToBuilder(exId) {
  const b = state.builder;
  if (!b) return false;
  const day = b.dias.find(d => d.id === b.diaSel);
  if (!day || !EX[exId]) return false;
  day.items.push({ ex: exId, alias: '', sets: '3×12' });
  saveBorrador();
  refreshBuilderPanel();
  toast('✓ ' + (EX[exId].n.length > 34 ? EX[exId].n.slice(0, 32) + '…' : EX[exId].n) + ' → ' + day.dia);
  return true;
}

modalRoot.addEventListener('click', ev => {
  if (ev.target.closest('[data-close]') || ev.target.matches('[data-close-bg]')) { closeModal(); return; }

  const qb = ev.target.closest('[data-quickadd-bd]');
  if (qb) {
    if (addExToBuilder(modalRoot.dataset.ex)) closeModal();
    return;
  }

  const quick = ev.target.closest('[data-quickadd]');
  if (quick && state.addTarget) {
    const t = state.addTarget;
    if (addExTo(t.rid, t.dayId, modalRoot.dataset.ex)) {
      closeModal();
      state.addTarget = null;
      state.seccion = 'rutinas';
      state.rutSel = t.rid;
      store.set('gf.seccion', 'rutinas');
      store.set('gf.rutSel', t.rid);
      render();
    }
    return;
  }

  const rbtn = ev.target.closest('[data-addr]');
  if (rbtn) {
    const rid = rbtn.dataset.addr;
    modalRoot.querySelectorAll('[data-addr]').forEach(b => b.setAttribute('aria-pressed', b === rbtn));
    const daysEl = modalRoot.querySelector('#addto-days');
    const rut = getRutina(rid);
    if (!rut) return;
    daysEl.innerHTML = rut.dias.map(d => '<button class="chip" data-addd="' + d.id + '" data-rid="' + rid + '">→ ' + esc(d.dia) + ' · ' + esc(d.titulo) + '</button>').join('');
    daysEl.hidden = false;
    return;
  }

  const dbtn = ev.target.closest('[data-addd]');
  if (dbtn) {
    if (addExTo(dbtn.dataset.rid, dbtn.dataset.addd, modalRoot.dataset.ex)) {
      closeModal();
      if (state.seccion === 'rutinas' && state.rutSel === dbtn.dataset.rid) render();
    }
    return;
  }
});

/* ---------- Interacciones ---------- */

tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b || b.dataset.rut === state.rutSel) return;
  state.rutSel = b.dataset.rut;
  state.editDays = {};
  state.addTarget = null;
  store.set('gf.rutSel', state.rutSel);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function refreshDay(key, color) {
  const card = appEl.querySelector('[data-daycard="' + key + '"]');
  if (!card) return;
  const total = Number(card.dataset.total);
  const done = store.get(doneKey(key), []).length;
  const count = card.querySelector('[data-count="' + key + '"]');
  if (count) count.innerHTML = '<b>' + done + '</b>/' + total;
  const bar = card.querySelector('[data-bar="' + key + '"]');
  if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  const stamp = card.querySelector('[data-stamp="' + key + '"]');
  if (stamp) {
    const complete = total > 0 && done >= total;
    if (complete && stamp.hidden) {
      stamp.hidden = false;
      celebrate(card, color || '#FF4A24');
    } else if (!complete) {
      stamp.hidden = true;
    }
  }
}

function keyParts(key) {
  const i = key.indexOf('.');
  return [key.slice(0, i), key.slice(i + 1)];
}

appEl.addEventListener('input', e => {
  if (e.target.id === 'peso-in') {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v >= 40 && v <= 250) {
      store.set('gf.peso', v);
      const m = macros(v);
      const tiles = appEl.querySelectorAll('.macro b');
      if (tiles.length === 4) {
        tiles[0].textContent = m.prot;
        tiles[1].textContent = m.kcal;
        tiles[2].textContent = m.grasa;
        tiles[3].textContent = m.carbs;
      }
    }
    return;
  }
  if (e.target.id === 'cat-q') {
    state.catQ = e.target.value;
    state.catLimit = 36;
    refreshCatGrid();
    return;
  }
  if (e.target.id === 'bd-q') {
    const b = borrador();
    b.q = e.target.value;
    b.limit = 36;
    saveBorrador();
    refreshBuilderGrid();
    return;
  }
  if (e.target.id === 'rut-nombre') {
    const b = borrador();
    b.nombre = e.target.value;
    saveBorrador();
  }
});

appEl.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) { openEx(open.dataset.open); return; }

  /* --- Builder --- */

  const nd = e.target.closest('[data-ndias]');
  if (nd) {
    const b = borrador();
    b.nDias = Number(nd.dataset.ndias);
    saveBorrador();
    appEl.querySelectorAll('[data-ndias]').forEach(x => x.setAttribute('aria-pressed', x === nd));
    const note = appEl.querySelector('#ndias-note');
    if (note) note.textContent = b.nDias + (b.nDias === 1 ? ' día' : ' días') + ' de entrenamiento por semana';
    return;
  }

  const cont = e.target.closest('[data-bd-continuar]');
  if (cont) {
    const b = borrador();
    const dias = [];
    for (let i = 0; i < b.nDias; i++) {
      dias.push(b.dias[i] || { id: 'd' + (i + 1), dia: 'Día ' + (i + 1), titulo: 'Entrenamiento ' + (i + 1), items: [] });
    }
    b.dias = dias;
    b.fase = 2;
    if (!b.dias.some(d => d.id === b.diaSel)) b.diaSel = 'd1';
    saveBorrador();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const back = e.target.closest('[data-bd-back]');
  if (back) {
    const b = borrador();
    b.fase = 1;
    saveBorrador();
    render();
    return;
  }

  const bdDay = e.target.closest('[data-bd-day]');
  if (bdDay) {
    const b = borrador();
    b.diaSel = bdDay.dataset.bdDay;
    saveBorrador();
    refreshBuilderPanel();
    return;
  }

  const bdAdd = e.target.closest('[data-bdadd]');
  if (bdAdd) {
    if (addExToBuilder(bdAdd.dataset.bdadd)) {
      bdAdd.classList.add('added');
      setTimeout(() => bdAdd.classList.remove('added'), 700);
    }
    return;
  }

  const bdRm = e.target.closest('[data-bd-rm]');
  if (bdRm) {
    const b = borrador();
    const day = b.dias.find(d => d.id === b.diaSel);
    if (!day) return;
    day.items.splice(Number(bdRm.dataset.bdRm), 1);
    saveBorrador();
    refreshBuilderPanel();
    return;
  }

  const bdSets = e.target.closest('[data-bd-sets]');
  if (bdSets) {
    const b = borrador();
    const day = b.dias.find(d => d.id === b.diaSel);
    const idx = Number(bdSets.dataset.bdSets);
    if (!day || !day.items[idx]) return;
    const ex = EX[day.items[idx].ex];
    dlgInput('Series × reps', day.items[idx].sets, v => {
      if (v && v.trim()) {
        day.items[idx].sets = v.trim();
        saveBorrador();
        refreshBuilderPanel();
      }
    }, ex ? ex.n : '');
    return;
  }

  const bdRen = e.target.closest('[data-bd-rename]');
  if (bdRen) {
    const b = borrador();
    dlgInput('Nombre de la rutina', b.nombre || 'Mi rutina', v => {
      if (v && v.trim()) {
        b.nombre = v.trim();
        saveBorrador();
        render();
      }
    });
    return;
  }

  const bdMore = e.target.closest('[data-bd-more]');
  if (bdMore) {
    const b = borrador();
    b.limit += 36;
    saveBorrador();
    refreshBuilderGrid();
    return;
  }

  const bdGrupo = e.target.closest('[data-bd-grupo]');
  if (bdGrupo) {
    const b = borrador();
    b.grupo = bdGrupo.dataset.bdGrupo;
    b.limit = 36;
    saveBorrador();
    refreshBuilderGrid();
    return;
  }

  const bdSave = e.target.closest('[data-bd-save]');
  if (bdSave) {
    const b = borrador();
    const total = b.dias.reduce((a, d) => a + d.items.length, 0);
    if (!total) { toast('Agrega al menos un ejercicio antes de guardar'); return; }
    const rut = {
      id: 'r' + Date.now().toString(36),
      nombre: (b.nombre || '').trim() || 'Mi rutina',
      color: PALETA[misRutinas().length % PALETA.length],
      dias: b.dias,
    };
    saveRutina(rut);
    limpiarBorrador();
    state.editDays = {};
    state.rutSel = rut.id;
    store.set('gf.rutSel', rut.id);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    dlgExito(rut);
    return;
  }

  const bdCancel = e.target.closest('[data-bd-cancel]');
  if (bdCancel) {
    dlgConfirm('¿Descartar borrador?', 'Se pierde el nombre, los días y los ejercicios elegidos hasta ahora.', () => {
      limpiarBorrador();
      state.rutSel = 'test';
      store.set('gf.rutSel', 'test');
      render();
    }, 'Descartar');
    return;
  }

  /* --- Rutinas guardadas --- */

  const chk = e.target.closest('.check');
  if (chk) {
    const li = chk.closest('.ex');
    const key = li.dataset.day;
    const idx = Number(li.dataset.idx);
    const k = doneKey(key);
    let arr = store.get(k, []);
    if (arr.includes(idx)) arr = arr.filter(i => i !== idx); else arr.push(idx);
    store.set(k, arr);
    li.classList.toggle('done');
    chk.setAttribute('aria-pressed', li.classList.contains('done'));
    const rut = getRutina(keyParts(key)[0]);
    refreshDay(key, rut ? rut.color : null);
    return;
  }

  const setsBtn = e.target.closest('[data-sets]');
  if (setsBtn) {
    const li = setsBtn.closest('.ex');
    const [rid, dayId] = keyParts(li.dataset.day);
    const idx = Number(li.dataset.idx);
    const rut = getRutina(rid);
    if (!rut) return;
    const day = rut.dias.find(d => d.id === dayId);
    if (!day || !day.items[idx]) return;
    const ex = EX[day.items[idx].ex];
    dlgInput('Series × reps', day.items[idx].sets, v => {
      if (v && v.trim()) {
        day.items[idx].sets = v.trim();
        saveRutina(rut);
        setsBtn.textContent = v.trim();
      }
    }, day.items[idx].alias || (ex ? ex.n : ''));
    return;
  }

  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    const key = editBtn.dataset.edit;
    state.editDays[key] = !state.editDays[key];
    render();
    return;
  }

  const mvBtn = e.target.closest('[data-mv]');
  if (mvBtn) {
    const li = mvBtn.closest('.ex');
    const [rid, dayId] = keyParts(li.dataset.day);
    const idx = Number(li.dataset.idx);
    const dir = Number(mvBtn.dataset.mv);
    const rut = getRutina(rid);
    if (!rut) return;
    const day = rut.dias.find(d => d.id === dayId);
    if (!day) return;
    const j = idx + dir;
    if (j < 0 || j >= day.items.length) return;
    const tmp = day.items[idx];
    day.items[idx] = day.items[j];
    day.items[j] = tmp;
    saveRutina(rut);
    store.del(doneKey(li.dataset.day));
    render();
    return;
  }

  const rmBtn = e.target.closest('[data-rm]');
  if (rmBtn) {
    const li = rmBtn.closest('.ex');
    const [rid, dayId] = keyParts(li.dataset.day);
    const idx = Number(li.dataset.idx);
    const rut = getRutina(rid);
    if (!rut) return;
    const day = rut.dias.find(d => d.id === dayId);
    if (!day) return;
    day.items.splice(idx, 1);
    saveRutina(rut);
    store.del(doneKey(li.dataset.day));
    render();
    return;
  }

  const addBtn = e.target.closest('[data-add]');
  if (addBtn) {
    const [rid, dayId] = keyParts(addBtn.dataset.add);
    const rut = getRutina(rid);
    const day = rut && rut.dias.find(d => d.id === dayId);
    if (!rut || !day) return;
    state.addTarget = { rid, dayId, rutNombre: rut.nombre, diaNombre: day.dia };
    state.seccion = 'catalogo';
    store.set('gf.seccion', 'catalogo');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const renDia = e.target.closest('[data-ren-dia]');
  if (renDia) {
    const card = renDia.closest('[data-daycard]');
    if (!card || !card.classList.contains('edit-on')) return;
    const [rid, dayId] = keyParts(card.dataset.daycard);
    const rut = getRutina(rid);
    const day = rut && rut.dias.find(d => d.id === dayId);
    if (!day) return;
    dlgInput('Etiqueta del día', day.dia, v => {
      if (v && v.trim()) { day.dia = v.trim(); saveRutina(rut); render(); }
    }, 'Ej. Lunes, Martes, Día 1...');
    return;
  }

  const renTit = e.target.closest('[data-ren-tit]');
  if (renTit) {
    const card = renTit.closest('[data-daycard]');
    if (!card || !card.classList.contains('edit-on')) return;
    const [rid, dayId] = keyParts(card.dataset.daycard);
    const rut = getRutina(rid);
    const day = rut && rut.dias.find(d => d.id === dayId);
    if (!day) return;
    dlgInput('Título del día', day.titulo, v => {
      if (v && v.trim()) { day.titulo = v.trim(); saveRutina(rut); render(); }
    }, 'Ej. Empuje, Pierna, Full body...');
    return;
  }

  const renRut = e.target.closest('[data-ren-rut]');
  if (renRut) {
    const rut = getRutina(renRut.dataset.renRut);
    if (!rut) return;
    dlgInput('Nombre de la rutina', rut.nombre, v => {
      if (v && v.trim()) { rut.nombre = v.trim(); saveRutina(rut); render(); }
    });
    return;
  }

  const delRut = e.target.closest('[data-del-rut]');
  if (delRut) {
    const rut = getRutina(delRut.dataset.delRut);
    if (!rut) return;
    dlgConfirm('¿Eliminar «' + rut.nombre + '»?', 'Se borra la rutina completa y su pestaña. No se puede deshacer.', () => {
      deleteRutina(rut.id);
      state.rutSel = 'test';
      store.set('gf.rutSel', 'test');
      render();
    }, 'Eliminar');
    return;
  }

  const resetTest = e.target.closest('[data-reset-test]');
  if (resetTest) {
    dlgConfirm('¿Restaurar la Rutina Test?', 'Vuelve a su estado original y se pierden tus cambios en ella.', () => {
      deleteRutina('test');
      state.editDays = {};
      render();
    }, 'Restaurar');
    return;
  }

  /* --- Catálogo --- */

  const moreBtn = e.target.closest('[data-more]');
  if (moreBtn) {
    state.catLimit += 36;
    refreshCatGrid();
    return;
  }

  const chip = e.target.closest('[data-grupo]');
  if (chip) {
    state.catGrupo = chip.dataset.grupo;
    state.catLimit = 36;
    refreshCatGrid();
    return;
  }
});

/* ---------- Celebración ---------- */

function celebrate(card, color) {
  if (navigator.vibrate) navigator.vibrate([70, 40, 70, 40, 150]);
  card.classList.remove('celebrate');
  void card.offsetWidth;
  card.classList.add('celebrate');
  setTimeout(() => card.classList.remove('celebrate'), 1250);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer = document.createElement('div');
  layer.className = 'cf-layer';
  const r = card.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = Math.max(70, Math.min(r.top + 90, innerHeight - 120));
  const colors = [color, color, '#FF4A24', '#FFC53D', '#3E8BFF', '#35D07F', '#F2F1EC'];
  for (let i = 0; i < 48; i++) {
    const c = document.createElement('i');
    c.className = 'cf';
    const w = 5 + Math.random() * 6;
    c.style.width = w + 'px';
    c.style.height = (Math.random() < .35 ? w : w * (1.5 + Math.random())) + 'px';
    c.style.borderRadius = Math.random() < .3 ? '50%' : '2px';
    c.style.background = colors[i % colors.length];
    c.style.left = cx + 'px';
    c.style.top = cy + 'px';
    c.style.setProperty('--dx', ((Math.random() * 2 - 1) * (90 + Math.random() * 250)) + 'px');
    c.style.setProperty('--up', -(70 + Math.random() * 230) + 'px');
    c.style.setProperty('--down', (150 + Math.random() * 330) + 'px');
    c.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    c.style.animationDuration = (1.1 + Math.random() * .9) + 's';
    c.style.animationDelay = (Math.random() * .15) + 's';
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 2400);
}

/* ---------- Cronómetro ---------- */

const countEl = document.getElementById('count');
const stopBtn = document.getElementById('stopBtn');
const timerEl = document.getElementById('timer');
const ringEl = document.getElementById('ring');
let timerId = null, endAt = 0, totalMs = 0, audioCtx = null;

function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(audioCtx.currentTime + 0.45);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function stopTimer(fin) {
  clearInterval(timerId); timerId = null;
  stopBtn.hidden = true;
  countEl.textContent = fin ? '¡YA!' : '—';
  ringEl.style.setProperty('--p', fin ? 100 : 0);
  if (fin) { beep(); timerEl.classList.add('flash'); setTimeout(() => timerEl.classList.remove('flash'), 1500); }
}

function tick() {
  const left = Math.max(0, endAt - Date.now());
  countEl.textContent = Math.ceil(left / 1000);
  ringEl.style.setProperty('--p', (1 - left / totalMs) * 100);
  if (left <= 0) stopTimer(true);
}

timerEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  totalMs = Number(b.dataset.t) * 1000;
  endAt = Date.now() + totalMs;
  clearInterval(timerId);
  timerId = setInterval(tick, 200);
  stopBtn.hidden = false;
  tick();
});
stopBtn.addEventListener('click', () => stopTimer(false));

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); dlgClose(); setDrawer(false); } });

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();
</script>
